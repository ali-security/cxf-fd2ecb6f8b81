name: seal-build

# Upstream Apache CXF 3.2.4 has no GitHub Actions CI (it built on Apache Jenkins).
# This workflow mirrors BUILDING.txt: `mvn install` with JDK 8, then runs the
# cxf-core unit suite plus the rt/ws/policy suite (the module that drives Neethi
# policy normalization).
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MAVEN_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=768m"
      TEST_FILTER: ${{ inputs.test-filter }}
      QA_SKIPS: "-Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dgpg.skip=true -Drat.skip=true -Dinvoker.skip=true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.9.5
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.5/binaries/apache-maven-3.9.5-bin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.5/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          java -version
          mvn -version

      - name: Build and test cxf-core (with its reactor parents)
        run: |
          set -euo pipefail
          if [ -n "$TEST_FILTER" ]; then
            FILTER_ARGS="-Dtest=$TEST_FILTER -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false"
          else
            FILTER_ARGS=""
          fi
          mvn -B -e clean install -pl core -am $QA_SKIPS $FILTER_ARGS

      - name: Test rt/ws/policy (Neethi policy normalization consumer)
        run: |
          set -euo pipefail
          if [ -n "$TEST_FILTER" ]; then
            FILTER_ARGS="-Dtest=$TEST_FILTER -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false"
          else
            FILTER_ARGS=""
          fi
          mvn -B -e test -pl rt/ws/policy $QA_SKIPS $FILTER_ARGS

      - name: Test results summary and skip reasons
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, re, xml.etree.ElementTree as ET
          total = fail = err = skip = 0
          for f in sorted(glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); fail += int(r.get("failures", 0))
              err += int(r.get("errors", 0)); skip += int(r.get("skipped", 0))
              for tc in r.findall("testcase"):
                  s = tc.find("skipped")
                  if s is None:
                      continue
                  cls, name = tc.get("classname"), tc.get("name")
                  reason = s.get("message") or ""
                  module = f.split("/target/")[0]
                  src = os.path.join(module, "src/test/java", cls.replace(".", "/") + ".java")
                  if not reason and os.path.exists(src):
                      lines = open(src, encoding="utf-8", errors="replace").read().splitlines()
                      for i, line in enumerate(lines):
                          if re.search(r"\b%s\s*\(" % re.escape(name), line) and "void" in line:
                              for j in range(max(0, i - 5), i):
                                  if "Ignore" in lines[j]:
                                      reason = "upstream annotation: " + lines[j].strip()
                              break
                  print(f"SKIPPED {cls}.{name}: {reason or 'no reason recorded'}")
          print(f"SUMMARY tests={total} passed={total - fail - err - skip} failures={fail} errors={err} skipped={skip}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: cxf-core
          path: core/target/cxf-core-3.2.4.jar
          if-no-files-found: error
